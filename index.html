<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shipping Label Generator</title>
  <!-- SheetJS for Excel parsing -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
  <!-- jsPDF for PDF generation -->
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <!-- JSZip for zipping files -->
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.0/dist/jszip.min.js"></script>
  <!-- FileSaver for saving blobs -->
  <script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
  <style>
    body { font-family: sans-serif; margin: 20px; }
    label { display: block; margin-bottom: 10px; }
    button { margin-top: 20px; padding: 10px 20px; }
  </style>
</head>
<body>
  <h1>Shipping Label Generator</h1>
  <label>
    Header Image: <input type="file" id="headerInput" accept="image/*">
  </label>
  <label>
    Footer Image: <input type="file" id="footerInput" accept="image/*">
  </label>
  <label>
    Excel File: <input type="file" id="excelInput" accept=".xls,.xlsx">
  </label>
  <button id="generateBtn">Generate Labels</button>

  <script>
  const { jsPDF } = window.jspdf;

  document.getElementById('generateBtn').addEventListener('click', async () => {
    const headerFile = document.getElementById('headerInput').files[0];
    const footerFile = document.getElementById('footerInput').files[0];
    const excelFile = document.getElementById('excelInput').files[0];
    if (!headerFile || !footerFile || !excelFile) {
      alert('Please select header, footer, and Excel files.');
      return;
    }

    // Read files
    const headerDataUrl = await readFileAsDataURL(headerFile);
    const footerDataUrl = await readFileAsDataURL(footerFile);
    const arrayBuffer = await readFileAsArrayBuffer(excelFile);

    // Parse Excel
    const workbook = XLSX.read(arrayBuffer, { type: 'array' });
    const sheet = workbook.Sheets[workbook.SheetNames[0]];
    let rows = XLSX.utils.sheet_to_json(sheet, { defval: '' });

    // Forward-fill essential columns
    const keys = ["Invoice", "First Name", "Last Name", "Phone", "Address", "Order Total Amount"];
    let lastVals = {};
    rows = rows.map(r => {
      keys.forEach(k => {
        if (r[k] !== '') lastVals[k] = r[k];
        else r[k] = lastVals[k] || '';
      });
      return r;
    });

    // Group by invoice
    const groups = {};
    rows.forEach(r => {
      const inv = String(r['Invoice']).trim();
      groups[inv] = groups[inv] || [];
      groups[inv].push(r);
    });

    // Generate PDFs
    const pdfFiles = [];
    for (const inv in groups) {
      const data = groups[inv];
      const doc = new jsPDF({ unit: 'mm', format: [152.4, 101.6] });
      doc.addImage(headerDataUrl, 'PNG', 0, 0, 101.6, 30);
      doc.addImage(footerDataUrl, 'PNG', 0, 106.4, 101.6, 49);
      doc.setFontSize(10);
      let y = 41;

      // Invoice #
      doc.text(`Invoice #: ${inv}`, 5, y); y += 7;
      // Name
      const name = titleCase(data[0]['First Name'] + ' ' + data[0]['Last Name']);
      doc.text(`Name: ${name}`, 5, y); y += 7;
      // Phone
      let phone = String(data[0]['Phone']).split('.')[0];
      if (!phone.startsWith('0')) phone = '0' + phone;
      doc.text(`Phone: ${phone}`, 5, y); y += 7;
      // Address
      doc.text('Address:', 5, y); y += 7;
      const addressLines = doc.splitTextToSize(titleCase(data[0]['Address']), 66);
      doc.text(addressLines, 5, y);
      y += addressLines.length * 7;

      // Total
      const notes = data.map(r=>r['NOTE']||'').join(' ').toLowerCase();
      const isPaid = notes.includes('paid');
      const total = isPaid ? '0' : String(Math.round(data[0]['Order Total Amount']));
      doc.text(`Total: Tk ${total}`, 5, y); y += 7;

      // Items
      doc.text('Items:', 5, y); y += 7;
      data.forEach(r => {
        const item = r['Items'] ? titleCase(r['Items']) : '';
        const qty = r['Quantity'] ? ` (${r['Quantity']})` : '';
        if (item) {
          doc.text(`- ${item}${qty}`, 5, y);
          y += 7;
        }
      });

      const blob = doc.output('blob');
      pdfFiles.push({ name: `${inv}.pdf`, blob });
    }

    // Zip all PDFs
    const zip = new JSZip();
    pdfFiles.forEach(f => zip.file(f.name, f.blob));
    const zipBlob = await zip.generateAsync({ type: 'blob' });
    saveAs(zipBlob, 'shipping_labels.zip');
  });

  function readFileAsDataURL(file) {
    return new Promise(res => {
      const reader = new FileReader();
      reader.onload = () => res(reader.result);
      reader.readAsDataURL(file);
    });
  }

  function readFileAsArrayBuffer(file) {
    return new Promise(res => {
      const reader = new FileReader();
      reader.onload = () => res(reader.result);
      reader.readAsArrayBuffer(file);
    });
  }

  function titleCase(str) {
    return str.toLowerCase().split(' ').map(s => s.charAt(0).toUpperCase() + s.slice(1)).join(' ');
  }
  </script>
</body>
</html>
