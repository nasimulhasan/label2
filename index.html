<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shipping Label Generator</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { padding-top: 4rem; background: #f8f9fa; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="container d-flex justify-content-center">
    <div class="w-50" style="max-width: 600px;">

      <!-- Unlock Page -->
      <div id="unlockPage" class="card shadow-sm mb-4">
        <div class="card-body p-4 text-center">
          <h1 class="card-title mb-4">Enter Unlock Code</h1>
          <div class="mb-3">
            <input type="text" id="unlockInput" class="form-control" placeholder="Enter unlock code">
          </div>
          <button id="unlockBtn" class="btn btn-primary w-100 mb-3">Unlock</button>
          <div id="unlockAlert" class="mt-3"></div>

          <div class="accordion mt-4" id="unlockInfoAccordion">
            <div class="accordion-item">
              <h2 class="accordion-header" id="headingUnlockInfo">
                <button class="accordion-button collapsed" type="button"
                        data-bs-toggle="collapse" data-bs-target="#collapseUnlockInfo"
                        aria-expanded="false" aria-controls="collapseUnlockInfo">
                  How to get Unlock Code?
                </button>
              </h2>
              <div id="collapseUnlockInfo" class="accordion-collapse collapse"
                   aria-labelledby="headingUnlockInfo" data-bs-parent="#unlockInfoAccordion">
                <div class="accordion-body text-start">
                  <p>
                    To obtain an unlock code, please visit our pricing page and complete the purchase form.
                    Once payment is confirmed, your code will be emailed to you within minutes.
                  </p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- Bootstrap Bundle JS (includes Collapse) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const unlockBtn = document.getElementById('unlockBtn');
      const unlockInput = document.getElementById('unlockInput');
      const unlockAlert = document.getElementById('unlockAlert');

      unlockBtn.addEventListener('click', async () => {
        const code = unlockInput.value.trim();
        unlockAlert.innerHTML = '';
        try {
          const resp = await fetch('https://raw.githubusercontent.com/nasimulhasan/testlabel/main/keys.json');
          if (!resp.ok) throw new Error('Network error');
          const { validCodes } = await resp.json();
          if (validCodes.includes(code)) {
            unlockAlert.innerHTML = '<div class="alert alert-success">Unlocked!</div>';
            // proceed to show generator (not included here)
          } else {
            unlockAlert.innerHTML = '<div class="alert alert-warning">Invalid code</div>';
          }
        } catch (err) {
          unlockAlert.innerHTML = '<div class="alert alert-danger">Error verifying code</div>';
        }
      });
    });
  </script>
</body>
</html>
