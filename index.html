<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Label Generator (JavaScript Only)</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body class="bg-light">
  <div class="container py-5">
    <h2 class="mb-4 text-center">Label Generator (Browser-only)</h2>

    <!-- Manual Entry Section -->
    <div id="manualSection">
      <div class="card">
        <div class="card-body">
          <h5 class="card-title">Manual Label Entry</h5>
          <form id="manualForm">
            <div class="mb-2">
              <input class="form-control" name="invoice" placeholder="Invoice Number" required>
            </div>
            <div class="mb-2">
              <input class="form-control" name="name" placeholder="Customer Name" required>
            </div>
            <div class="mb-2">
              <input class="form-control" name="phone" placeholder="Phone Number" required>
            </div>
            <div class="mb-2">
              <textarea class="form-control" name="address" placeholder="Shipping Address" required></textarea>
            </div>
            <div class="mb-2">
              <input class="form-control" name="amount" placeholder="Total Amount (Tk)" required>
            </div>
            <div class="mb-2">
              <input class="form-control" name="note" placeholder="Note (optional)">
            </div>
            <div class="mb-2">
              <label>Items</label>
              <div id="itemList">
                <div class="input-group mb-2">
                  <input class="form-control item-name" placeholder="Item name">
                  <input class="form-control item-qty" type="number" placeholder="Qty">
                  <button class="btn btn-outline-secondary remove-item" type="button">×</button>
                </div>
              </div>
              <button class="btn btn-sm btn-outline-primary" id="addItem" type="button">Add Item</button>
            </div>
            <button class="btn btn-success mt-2" type="submit">Generate PDF</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script>
    const { jsPDF } = window.jspdf;

    $(document).on('click', '#addItem', function () {
      $('#itemList').append(`
        <div class="input-group mb-2">
          <input class="form-control item-name" placeholder="Item name">
          <input class="form-control item-qty" type="number" placeholder="Qty">
          <button class="btn btn-outline-secondary remove-item" type="button">×</button>
        </div>`);
    });

    $(document).on('click', '.remove-item', function () {
      $(this).closest('.input-group').remove();
    });

    $('#manualForm').submit(function (e) {
      e.preventDefault();

      const doc = new jsPDF({ unit: 'mm', format: [101.6, 152.4] });
      doc.setFontSize(10);

      const invoice = $('input[name="invoice"]').val().trim();
      const name = $('input[name="name"]').val().trim();
      const phone = $('input[name="phone"]').val().trim();
      const address = $('textarea[name="address"]').val().trim();
      const amount = $('input[name="amount"]').val().trim();
      const note = $('input[name="note"]').val().trim();

      const items = [];
      $('#itemList .input-group').each(function () {
        const itemName = $(this).find('.item-name').val().trim();
        const itemQty = $(this).find('.item-qty').val().trim();
        if (itemName && itemQty) {
          items.push(`${itemName} (${itemQty})`);
        }
      });

      let y = 20;
      doc.text(`Invoice #: ${invoice}`, 10, y); y += 6;
      doc.text(`Name: ${name}`, 10, y); y += 6;
      doc.text(`Phone: ${phone}`, 10, y); y += 6;
      doc.text(`Address:`, 10, y); y += 5;
      doc.text(doc.splitTextToSize(address, 85), 10, y); y += 10;
      doc.text(`Total: Tk ${note.toLowerCase().includes("paid") ? '0' : amount}`, 10, y); y += 6;
      doc.text(`Items:`, 10, y); y += 5;

      items.forEach(item => {
        doc.text(`- ${item}`, 12, y);
        y += 5;
      });

      doc.save(`${invoice.replace('/', '-')}.pdf`);
    });
  </script>
</body>
</html>
