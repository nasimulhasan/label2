<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shipping Label Generator</title>
  <!-- SheetJS for Excel parsing -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
  <!-- jsPDF for PDF generation -->
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <!-- JSZip for zipping files -->
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.0/dist/jszip.min.js"></script>
  <!-- FileSaver for saving blobs -->
  <script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
  <style>
    body { font-family: sans-serif; margin: 20px; }
    label { display: block; margin-bottom: 10px; }
    select, button, input { margin-top: 5px; }
    #rangeSelectors { margin-top: 20px; display: none; }
  </style>
</head>
<body>
  <h1>Shipping Label Generator</h1>
  <label>
    Header Image: <input type="file" id="headerInput" accept="image/*">
  </label>
  <label>
    Footer Image: <input type="file" id="footerInput" accept="image/*">
  </label>
  <label>
    Excel File: <input type="file" id="excelInput" accept=".xls,.xlsx">
  </label>
  <div id="rangeSelectors">
    <label>
      Start Invoice:
      <select id="startInvoiceSelect"></select>
    </label>
    <label>
      End Invoice:
      <select id="endInvoiceSelect"></select>
    </label>
  </div>
  <button id="generateBtn">Generate Labels</button>

  <script>
  const { jsPDF } = window.jspdf;
  let parsedRows = [];
  let invoiceList = [];

  document.getElementById('excelInput').addEventListener('change', async event => {
    const file = event.target.files[0];
    if (!file) return;
    const buff = await readFileAsArrayBuffer(file);
    const wb = XLSX.read(buff, { type: 'array' });
    const sheet = wb.Sheets[wb.SheetNames[0]];
    let rows = XLSX.utils.sheet_to_json(sheet, { defval: '' });

    // Forward-fill essential columns
    const keys = ["Invoice", "First Name", "Last Name", "Phone", "Address", "Order Total Amount"];
    const last = {};
    rows = rows.map(r => {
      keys.forEach(k => {
        if (r[k] !== '') last[k] = r[k];
        else r[k] = last[k] || '';
      });
      return r;
    });
    parsedRows = rows;

    // Populate invoice dropdowns
    invoiceList = [...new Set(rows.map(r => String(r['Invoice']).trim()))].sort();
    populateSelect('startInvoiceSelect', invoiceList);
    populateSelect('endInvoiceSelect', invoiceList);
    document.getElementById('rangeSelectors').style.display = 'block';
  });

  document.getElementById('generateBtn').addEventListener('click', async () => {
    const headerFile = document.getElementById('headerInput').files[0];
    const footerFile = document.getElementById('footerInput').files[0];
    if (!headerFile || !footerFile) {
      alert('Please select header and footer images.');
      return;
    }
    if (!parsedRows.length) {
      alert('Please upload and parse an Excel file first.');
      return;
    }

    const start = document.getElementById('startInvoiceSelect').value;
    const end = document.getElementById('endInvoiceSelect').value;
    const startIdx = invoiceList.indexOf(start);
    const endIdx = invoiceList.indexOf(end);
    if (startIdx === -1 || endIdx === -1 || startIdx > endIdx) {
      alert('Invalid invoice range selection.');
      return;
    }
    const range = invoiceList.slice(startIdx, endIdx + 1);
    const headerDataUrl = await readFileAsDataURL(headerFile);
    const footerDataUrl = await readFileAsDataURL(footerFile);

    const pdfs = [];
    for (const inv of range) {
      const group = parsedRows.filter(r => String(r['Invoice']).trim() === inv);
      if (!group.length) continue;
      const doc = new jsPDF({ unit: 'mm', format: [152.4, 101.6] });
      doc.addImage(headerDataUrl, 'PNG', 0, 0, 101.6, 30);
      doc.addImage(footerDataUrl, 'PNG', 0, 106.4, 101.6, 49);
      doc.setFontSize(10);
      let y = 41;

      // Invoice #
      doc.text(`Invoice #: ${inv}`, 5, y); y += 7;
      // Name
      const name = titleCase(group[0]['First Name'] + ' ' + group[0]['Last Name']);
      doc.text(`Name: ${name}`, 5, y); y += 7;
      // Phone
      let phone = String(group[0]['Phone']).split('.')[0];
      if (!phone.startsWith('0')) phone = '0' + phone;
      doc.text(`Phone: ${phone}`, 5, y); y += 7;
      // Address
      doc.text('Address:', 5, y); y += 7;
      const addrLines = doc.splitTextToSize(titleCase(group[0]['Address']), 66);
      doc.text(addrLines, 5, y);
      y += addrLines.length * 7;

      // Total
      const notes = group.map(r => r['NOTE'] || '').join(' ').toLowerCase();
      const isPaid = notes.includes('paid');
      const total = isPaid ? '0' : String(Math.round(group[0]['Order Total Amount']));
      doc.text(`Total: Tk ${total}`, 5, y); y += 7;

      // Items
      doc.text('Items:', 5, y); y += 7;
      group.forEach(r => {
        const item = r['Items'] ? titleCase(r['Items']) : '';
        const qty = r['Quantity'] ? ` (${r['Quantity']})` : '';
        if (item) {
          doc.text(`- ${item}${qty}`, 5, y);
          y += 7;
        }
      });

      pdfs.push({ name: `${inv}.pdf`, blob: doc.output('blob') });
    }

    // Zip
    const zip = new JSZip();
    pdfs.forEach(f => zip.file(f.name, f.blob));
    const zipBlob = await zip.generateAsync({ type: 'blob' });
    saveAs(zipBlob, 'shipping_labels.zip');
  });

  function populateSelect(id, list) {
    const sel = document.getElementById(id);
    sel.innerHTML = '';
    list.forEach(v => {
      const opt = document.createElement('option'); opt.value = v; opt.textContent = v;
      sel.appendChild(opt);
    });
  }

  function readFileAsDataURL(file) {
    return new Promise(res => {
      const reader = new FileReader(); reader.onload = () => res(reader.result);
      reader.readAsDataURL(file);
    });
  }

  function readFileAsArrayBuffer(file) {
    return new Promise(res => {
      const reader = new FileReader(); reader.onload = () => res(reader.result);
      reader.readAsArrayBuffer(file);
    });
  }

  function titleCase(str) {
    return String(str).toLowerCase().split(' ').map(s => s.charAt(0).toUpperCase() + s.slice(1)).join(' ');
  }
  </script>
</body>
</html>
