<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Label Generator</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <!-- SheetJS for Excel reading -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body class="bg-light">
  <div class="container py-5">
    <h2 class="mb-4 text-center">Label Generator</h2>

    <!-- Accordion Instructions -->
    <div class="accordion mb-4" id="instructionAccordion">
      <div class="accordion-item">
        <h2 class="accordion-header" id="headingOne">
          <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseOne">
            How to Use
          </button>
        </h2>
        <div id="collapseOne" class="accordion-collapse collapse" data-bs-parent="#instructionAccordion">
          <div class="accordion-body">
            <ol>
              <li>Upload Header and Footer PNG (same size).</li>
              <li>Select input method: Excel or Manual.</li>
              <li>If Excel: Upload .xlsx file and choose invoice number.</li>
              <li>If Manual: Enter data in the form.</li>
              <li>Click "Generate PDF" to get your label!</li>
            </ol>
          </div>
        </div>
      </div>
    </div>

    <!-- Header/Footer Upload -->
    <div class="card mb-4">
      <div class="card-body">
        <h5 class="card-title">Upload Header & Footer</h5>
        <div class="mb-3">
          <label class="form-label">Header PNG</label>
          <input class="form-control" type="file" id="headerImage" accept="image/png">
        </div>
        <div class="mb-3">
          <label class="form-label">Footer PNG</label>
          <input class="form-control" type="file" id="footerImage" accept="image/png">
        </div>
      </div>
    </div>

    <!-- Mode Toggle -->
    <div class="mb-4">
      <label class="form-label">Choose Input Mode:</label><br>
      <div class="form-check form-check-inline">
        <input class="form-check-input" type="radio" name="mode" value="excel" id="excelMode" checked>
        <label class="form-check-label" for="excelMode">Excel Upload</label>
      </div>
      <div class="form-check form-check-inline">
        <input class="form-check-input" type="radio" name="mode" value="manual" id="manualMode">
        <label class="form-check-label" for="manualMode">Manual Entry</label>
      </div>
    </div>

    <!-- Excel Section -->
    <div id="excelSection" class="card p-3 mb-4 bg-white border">
      <div class="mb-2">
        <label class="form-label">Upload Excel File</label>
        <input class="form-control" type="file" id="excelFile" accept=".xlsx, .xls">
      </div>
      <div class="mb-2">
        <label class="form-label">Select Invoice</label>
        <select class="form-select" id="invoiceSelect">
          <option value="">Select Invoice</option>
        </select>
      </div>
      <button class="btn btn-success mt-2" id="generateFromExcel">Generate Label</button>
    </div>

    <!-- Manual Section -->
    <div id="manualSection" class="card p-3 mb-4 bg-white border" style="display: none;">
      <form id="manualForm">
        <div class="mb-2">
          <input class="form-control" name="invoice" placeholder="Invoice Number" required>
        </div>
        <div class="mb-2">
          <input class="form-control" name="name" placeholder="Customer Name" required>
        </div>
        <div class="mb-2">
          <input class="form-control" name="phone" placeholder="Phone Number" required>
        </div>
        <div class="mb-2">
          <textarea class="form-control" name="address" placeholder="Shipping Address" required></textarea>
        </div>
        <div class="mb-2">
          <input class="form-control" name="amount" placeholder="Total Amount (Tk)" required>
        </div>
        <div class="mb-2">
          <input class="form-control" name="note" placeholder="Note (optional)">
        </div>
        <div class="mb-2">
          <label>Items</label>
          <div id="itemList">
            <div class="input-group mb-2">
              <input class="form-control item-name" placeholder="Item name">
              <input class="form-control item-qty" type="number" placeholder="Qty">
              <button class="btn btn-outline-secondary remove-item" type="button">×</button>
            </div>
          </div>
          <button class="btn btn-sm btn-outline-primary" id="addItem" type="button">Add Item</button>
        </div>
        <button class="btn btn-success mt-2" type="submit">Generate PDF</button>
      </form>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Your custom JS -->
  <script src="script.js"></script>
</body>
</html>
