<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Shipping Label Generator</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <!-- SheetJS -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
  <!-- jsPDF UMD -->
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <style>
    body { padding-top: 4rem; background: #f8f9fa; }
    .hidden { display: none !important; }
    @media (min-width: 768px) {
      .col-md-6 { flex: 0 0 50%; max-width: 50%; }
    }
  </style>
</head>
<body>
  <div class="container d-flex justify-content-center">
    <div style="width:80%; max-width:800px;">

      <!-- Unlock Page -->
      <div id="unlockPage" class="card shadow-sm mb-4">
        <div class="card-body p-4 text-center">
          <h1 class="card-title mb-4">Enter Activation Code</h1>
          <input type="text" id="unlockInput" class="form-control mb-3" placeholder="Enter activation code">
          <button id="unlockBtn" class="btn btn-primary w-100 mb-3">Unlock</button>
          <div id="unlockAlert"></div>
        </div>
      </div>

      <!-- Excel Generator (hidden until unlocked) -->
      <div id="generatorPage" class="hidden">
        <div class="card shadow-sm mb-4">
          <div class="card-body p-4">

            <h2 class="h5 mb-4 text-center">Excel Label Generator</h2>

            <div class="mb-3">
              <label class="form-label">Upload Font (.ttf)</label>
              <input type="file" id="fontInput" class="form-control" accept=".ttf">
            </div>

            <div class="mb-3">
              <label class="form-label">Header Image</label>
              <input type="file" id="headerInput" class="form-control" accept="image/*">
            </div>

            <div class="mb-3">
              <label class="form-label">Footer Image</label>
              <input type="file" id="footerInput" class="form-control" accept="image/*">
            </div>

            <div class="mb-3 row">
              <label class="col-sm-4 col-form-label">Paper Size</label>
              <div class="col-sm-8">
                <select id="presetSize" class="form-select">
                  <option value="101.6,152.4,mm">4×6 in</option>
                  <option value="152.4,101.6,mm">6×4 in</option>
                  <option value="210,297,mm">A4</option>
                  <option value="216,279,mm">Letter</option>
                  <option value="custom">Custom</option>
                </select>
              </div>
            </div>

            <div id="customSizeFields" class="mb-3 row d-none">
              <div class="col-sm-4">
                <input type="number" id="paperWidth" class="form-control" placeholder="Width">
              </div>
              <div class="col-sm-4">
                <input type="number" id="paperHeight" class="form-control" placeholder="Height">
              </div>
              <div class="col-sm-4">
                <select id="paperUnit" class="form-select">
                  <option value="mm" selected>mm</option>
                  <option value="in">in</option>
                  <option value="pt">pt</option>
                </select>
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label">Excel File</label>
              <input type="file" id="excelInput" class="form-control" accept=".xls,.xlsx">
            </div>

            <div id="invoiceSelection" class="mb-3 hidden">
              <label class="form-label">Select Invoices</label>
              <select id="invoiceSelect" class="form-select" multiple size="8"></select>
            </div>

            <button type="button" id="generateBtn" class="btn btn-primary w-100">Generate Labels</button>
          </div>
        </div>
      </div>
      <!-- End Generator -->

    </div>
  </div>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Main Logic -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const { jsPDF } = window.jspdf;

      // Unlock
      document.getElementById('unlockBtn').onclick = async () => {
        const code = document.getElementById('unlockInput').value.trim();
        const alert = document.getElementById('unlockAlert');
        alert.innerHTML = '';
        try {
          const resp = await fetch('https://raw.githubusercontent.com/nasimulhasan/testlabel/main/keys.json');
          const { validCodes } = await resp.json();
          if (validCodes.includes(code)) {
            alert.innerHTML = '<div class="alert alert-success">Unlocked!</div>';
            document.getElementById('unlockPage').classList.add('hidden');
            document.getElementById('generatorPage').classList.remove('hidden');
          } else {
            alert.innerHTML = '<div class="alert alert-warning">Invalid code</div>';
          }
        } catch {
          alert.innerHTML = '<div class="alert alert-danger">Error verifying code</div>';
        }
      };

      // Custom‐size toggle
      document.getElementById('presetSize').addEventListener('change', e => {
        document.getElementById('customSizeFields').classList.toggle('d-none', e.target.value !== 'custom');
      });

      // Invoice populator
      const excelIn = document.getElementById('excelInput'),
            invoiceSel = document.getElementById('invoiceSelect'),
            invoiceWrap = document.getElementById('invoiceSelection');

      excelIn.addEventListener('change', async e => {
        const file = e.target.files[0];
        if (!file) return;
        const data = await file.arrayBuffer();
        const wb = XLSX.read(data, { type: 'array' });
        const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: '' });
        invoiceSel.innerHTML = '';
        rows.forEach(r => {
          const inv = r['Invoice'] ?? r[Object.keys(r)[0]];
          if (inv) {
            const opt = document.createElement('option');
            opt.value = inv; opt.textContent = inv;
            invoiceSel.append(opt);
          }
        });
        invoiceWrap.classList.remove('hidden');
      });

      // Generate PDF
      document.getElementById('generateBtn').addEventListener('click', () => {
        const selected = Array.from(invoiceSel.selectedOptions).map(o => o.value);
        if (!selected.length) return alert('Select at least one invoice.');

        const [w,h,unit] = document.getElementById('presetSize').value.split(',').map((v,i)=>(i<2?Number(v):v));
        const doc = new jsPDF({ unit, format:[w,h] });

        // optional: load custom font
        const fontFile = document.getElementById('fontInput').files[0];
        if (fontFile) {
          const reader = new FileReader();
          reader.onload = () => {
            doc.addFileToVFS(fontFile.name, reader.result.split(',')[1]);
            doc.addFont(fontFile.name, 'CustomFont', 'normal');
            doc.setFont('CustomFont');
            renderPages();
          };
          reader.readAsDataURL(fontFile);
        } else {
          renderPages();
        }

        function renderPages() {
          const hdr = document.getElementById('headerInput').files[0];
          const ftr = document.getElementById('footerInput').files[0];

          selected.forEach((inv,i) => {
            if (i) doc.addPage();
            // header image
            if (hdr) {
              const img = new Image();
              img.onload = () => {
                doc.addImage(img, 'PNG', 10, 10, w-20, 20);
                writeBody(i);
              };
              img.src = URL.createObjectURL(hdr);
            } else writeBody(i);
          });

          function writeBody(pageIdx) {
            doc.setFontSize(16);
            doc.text(`Invoice: ${selected[pageIdx]}`, 10, 50);
            // footer
            if (ftr) {
              const img = new Image();
              img.onload = () => doc.addImage(img, 'PNG', 10, h-30, w-20, 20);
              img.src = URL.createObjectURL(ftr);
            }
            if (pageIdx === selected.length - 1) {
              doc.save('labels.pdf');
            }
          }
        }
      });
    });
  </script>
</body>
</html>
