<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Label Generator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body class="bg-light">
  <div class="container py-5">
    <h2 class="mb-4 text-center">Label Generator (Full Version)</h2>

    <!-- Header/Footer Upload -->
    <div class="card mb-4">
      <div class="card-body">
        <h5 class="card-title">Upload Header & Footer</h5>
        <input class="form-control mb-2" type="file" id="headerImage" accept="image/png">
        <input class="form-control" type="file" id="footerImage" accept="image/png">
      </div>
    </div>

    <!-- Mode Toggle -->
    <div class="mb-4">
      <label class="form-label">Choose Input Mode:</label><br>
      <div class="form-check form-check-inline">
        <input class="form-check-input" type="radio" name="mode" id="excelMode" checked>
        <label class="form-check-label" for="excelMode">Excel Upload</label>
      </div>
      <div class="form-check form-check-inline">
        <input class="form-check-input" type="radio" name="mode" id="manualMode">
        <label class="form-check-label" for="manualMode">Manual Entry</label>
      </div>
    </div>

    <!-- Excel Upload Section -->
    <div id="excelSection">
      <div class="card">
        <div class="card-body">
          <h5 class="card-title">Upload Excel and Generate Labels</h5>
          <input class="form-control mb-3" type="file" id="excelInput" accept=".xlsx,.xls">
          <div class="row">
            <div class="col">
              <label>Start Invoice</label>
              <select id="startInvoice" class="form-select"></select>
            </div>
            <div class="col">
              <label>End Invoice</label>
              <select id="endInvoice" class="form-select"></select>
            </div>
          </div>
          <button class="btn btn-success mt-3" id="generateExcelPDFs">Generate PDFs</button>
        </div>
      </div>
    </div>

    <!-- Manual Entry Section -->
    <div id="manualSection" style="display: none;">
      <div class="card">
        <div class="card-body">
          <h5 class="card-title">Manual Label Entry</h5>
          <form id="manualForm">
            <input class="form-control mb-2" name="invoice" placeholder="Invoice Number" required>
            <input class="form-control mb-2" name="name" placeholder="Customer Name" required>
            <input class="form-control mb-2" name="phone" placeholder="Phone Number" required>
            <textarea class="form-control mb-2" name="address" placeholder="Shipping Address" required></textarea>
            <input class="form-control mb-2" name="amount" placeholder="Total Amount (Tk)" required>
            <input class="form-control mb-2" name="note" placeholder="Note (optional)">

            <label>Items</label>
            <div id="itemList">
              <div class="input-group mb-2">
                <input class="form-control item-name" placeholder="Item name">
                <input class="form-control item-qty" type="number" placeholder="Qty">
                <button class="btn btn-outline-secondary remove-item" type="button">×</button>
              </div>
            </div>
            <button class="btn btn-sm btn-outline-primary" id="addItem" type="button">Add Item</button>
            <button class="btn btn-success mt-2" type="submit">Generate PDF</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script>
    const { jsPDF } = window.jspdf;
    let headerImgData = null;
    let footerImgData = null;

    // Mode toggle
    $('input[name="mode"]').on('change', function () {
      $('#excelSection').toggle($('#excelMode').is(':checked'));
      $('#manualSection').toggle($('#manualMode').is(':checked'));
    });

    // Image loading
    function toBase64(file, callback) {
      const reader = new FileReader();
      reader.onload = () => callback(reader.result);
      reader.readAsDataURL(file);
    }

    $('#headerImage').on('change', function () {
      if (this.files[0]) toBase64(this.files[0], data => headerImgData = data);
    });
    $('#footerImage').on('change', function () {
      if (this.files[0]) toBase64(this.files[0], data => footerImgData = data);
    });

    // Manual items
    $(document).on('click', '#addItem', function () {
      $('#itemList').append(`
        <div class="input-group mb-2">
          <input class="form-control item-name" placeholder="Item name">
          <input class="form-control item-qty" type="number" placeholder="Qty">
          <button class="btn btn-outline-secondary remove-item" type="button">×</button>
        </div>`);
    });
    $(document).on('click', '.remove-item', function () {
      $(this).closest('.input-group').remove();
    });

    // Manual PDF
    $('#manualForm').submit(function (e) {
      e.preventDefault();
      const doc = new jsPDF({ unit: 'mm', format: [101.6, 152.4] });
      generateLabelPDF(doc, {
        invoice: $('[name="invoice"]').val().trim(),
        name: $('[name="name"]').val().trim(),
        phone: $('[name="phone"]').val().trim(),
        address: $('[name="address"]').val().trim(),
        amount: $('[name="amount"]').val().trim(),
        note: $('[name="note"]').val().trim(),
        items: $('#itemList .input-group').map(function () {
          return {
            name: $(this).find('.item-name').val().trim(),
            qty: $(this).find('.item-qty').val().trim()
          }
        }).get().filter(i => i.name && i.qty)
      });
    });

    // Excel parsing
    $('#excelInput').on('change', function () {
      const file = this.files[0];
      const reader = new FileReader();
      reader.onload = (e) => {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, { type: 'array' });
        const sheet = workbook.Sheets[workbook.SheetNames[0]];
        const json = XLSX.utils.sheet_to_json(sheet, { defval: '' });

        const invoices = [...new Set(json.map(row => row.Invoice))].filter(Boolean);
        $('#startInvoice, #endInvoice').empty();
        invoices.forEach(i => $('#startInvoice, #endInvoice').append(`<option value="${i}">${i}</option>`));

        $('#generateExcelPDFs').off('click').on('click', () => {
          const start = $('#startInvoice').val();
          const end = $('#endInvoice').val();
          const startIndex = invoices.indexOf(start);
          const endIndex = invoices.indexOf(end);
          const slice = invoices.slice(startIndex, endIndex + 1);

          slice.forEach(invoice => {
            const group = json.filter(row => row.Invoice === invoice);
            if (!group.length) return;
            const base = group[0];
            const items = group.map(row => ({ name: row.Items, qty: row.Quantity })).filter(i => i.name);

            const doc = new jsPDF({ unit: 'mm', format: [101.6, 152.4] });
            generateLabelPDF(doc, {
              invoice: base.Invoice,
              name: `${base["First Name"]} ${base["Last Name"]}`,
              phone: base.Phone,
              address: base.Address,
              amount: base["Order Total Amount"],
              note: base.Note,
              items: items
            });
          });
        });
      };
      reader.readAsArrayBuffer(file);
    });

    // Label PDF builder
    function generateLabelPDF(doc, data) {
      doc.setFontSize(10);
      if (headerImgData) doc.addImage(headerImgData, 'PNG', 0, 0, 101.6, 30);
      if (footerImgData) doc.addImage(footerImgData, 'PNG', 0, 106.4, 101.6, 49);

      let y = 40;
      doc.text(`Invoice #: ${data.invoice}`, 5, y); y += 6;
      doc.text(`Name: ${data.name}`, 5, y); y += 6;
      doc.text(`Phone: ${data.phone}`, 5, y); y += 6;
      doc.text("Address:", 5, y); y += 5;
      doc.text(doc.splitTextToSize(data.address, 85), 5, y); y += 10;
      doc.text(`Total: Tk ${data.note?.toLowerCase().includes("paid") ? '0' : data.amount}`, 5, y); y += 6;
      doc.text("Items:", 5, y); y += 5;
      data.items.forEach(i => {
        doc.text(`- ${i.name} (${i.qty})`, 7, y);
        y += 5;
      });

      doc.save(`${data.invoice.replace('/', '-')}.pdf`);
    }
  </script>
</body>
</html>
