<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Label Generator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf"></script>
  <script src="MangoDream-normal.js"></script>
  <style>
    .pdf-preview {
      border: 1px solid #ccc;
      padding: 10px;
      margin-top: 20px;
    }
  </style>
</head>
<body class="bg-light">
  <div class="container py-5">
    <h2 class="mb-4 text-center">Label Generator</h2>

    <div class="mb-4">
      <label class="form-label">Choose Input Mode:</label><br>
      <div class="form-check form-check-inline">
        <input class="form-check-input" type="radio" name="mode" value="excel" id="excelMode" checked>
        <label class="form-check-label" for="excelMode">Excel Upload</label>
      </div>
      <div class="form-check form-check-inline">
        <input class="form-check-input" type="radio" name="mode" value="manual" id="manualMode">
        <label class="form-check-label" for="manualMode">Manual Entry</label>
      </div>
    </div>

    <div id="excelSection">
      <div class="card">
        <div class="card-body">
          <h5 class="card-title">Upload Excel</h5>
          <input class="form-control mb-3" type="file" id="excelFile" accept=".xlsx, .xls">
          <div class="row">
            <div class="col-md-6">
              <label for="startInvoice" class="form-label">Start Invoice</label>
              <select class="form-select" id="startInvoice">
                <option value="">Select Start</option>
              </select>
            </div>
            <div class="col-md-6">
              <label for="endInvoice" class="form-label">End Invoice</label>
              <select class="form-select" id="endInvoice">
                <option value="">Select End</option>
              </select>
            </div>
          </div>
          <button class="btn btn-success mt-3" id="generateExcelPDF">Generate PDF</button>
        </div>
      </div>
    </div>

    <div id="manualSection" style="display: none;">
      <div class="card">
        <div class="card-body">
          <h5 class="card-title">Manual Entry</h5>
          <form id="manualForm">
            <input class="form-control mb-2" placeholder="Invoice Number" name="invoice">
            <input class="form-control mb-2" placeholder="Customer Name" name="name">
            <input class="form-control mb-2" placeholder="Phone Number" name="phone">
            <textarea class="form-control mb-2" placeholder="Shipping Address" name="address"></textarea>
            <input class="form-control mb-2" placeholder="Total Amount" name="amount">
            <input class="form-control mb-2" placeholder="Note (optional)" name="note">
            <div class="mb-2">
              <label>Items</label>
              <div id="itemList">
                <div class="input-group mb-2">
                  <input class="form-control item-name" placeholder="Item name">
                  <input class="form-control item-qty" type="number" placeholder="Qty">
                  <button class="btn btn-outline-secondary remove-item" type="button">×</button>
                </div>
              </div>
              <button class="btn btn-sm btn-outline-primary" id="addItem" type="button">Add Item</button>
            </div>
            <button class="btn btn-success mt-2" type="submit">Generate PDF</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script>
    let excelData = [];

    $(document).ready(function () {
      $('input[name="mode"]').on('change', function () {
        const mode = $('input[name="mode"]:checked').val();
        $('#excelSection').toggle(mode === 'excel');
        $('#manualSection').toggle(mode === 'manual');
      });

      $('#excelFile').on('change', function (e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function (e) {
          const data = new Uint8Array(e.target.result);
          const workbook = XLSX.read(data, { type: 'array' });
          const sheetName = workbook.SheetNames[0];
          const sheet = workbook.Sheets[sheetName];
          excelData = XLSX.utils.sheet_to_json(sheet, { defval: "" });

          const invoiceSet = new Set();
          excelData.forEach(row => {
            if (row["Invoice"]) invoiceSet.add(String(row["Invoice"]).trim());
          });

          const invoices = Array.from(invoiceSet).sort();
          const startSelect = $('#startInvoice');
          const endSelect = $('#endInvoice');

          startSelect.empty().append('<option value="">Select Start</option>');
          endSelect.empty().append('<option value="">Select End</option>');

          invoices.forEach(inv => {
            startSelect.append(`<option value="${inv}">${inv}</option>`);
            endSelect.append(`<option value="${inv}">${inv}</option>`);
          });

          console.log("✅ Invoice dropdowns populated:", invoices);
        };
        reader.readAsArrayBuffer(file);
      });

      $(document).on('click', '#addItem', function () {
        $('#itemList').append(`
          <div class="input-group mb-2">
            <input class="form-control item-name" placeholder="Item name">
            <input class="form-control item-qty" type="number" placeholder="Qty">
            <button class="btn btn-outline-secondary remove-item" type="button">×</button>
          </div>`);
      });

      $(document).on('click', '.remove-item', function () {
        $(this).closest('.input-group').remove();
      });
    });
  </script>
</body>
</html>
