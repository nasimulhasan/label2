<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shipping Label Generator</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- SheetJS for Excel parsing -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
  <!-- jsPDF for PDF generation -->
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <!-- JSZip for zipping files -->
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.0/dist/jszip.min.js"></script>
  <!-- FileSaver for saving blobs -->
  <script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
  <style>
    body { background-color: #f8f9fa; }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">LabelGen</a>
    </div>
  </nav>

  <div class="container my-5">
    <div class="card shadow-sm">
      <div class="card-header bg-white">
        <h5 class="mb-0">Generate Shipping Labels</h5>
      </div>
      <div class="card-body">
        <form id="labelForm" class="row g-3">
          <div class="col-md-4">
            <label for="headerInput" class="form-label">Header Image</label>
            <input class="form-control" type="file" id="headerInput" accept="image/*">
          </div>
          <div class="col-md-4">
            <label for="footerInput" class="form-label">Footer Image</label>
            <input class="form-control" type="file" id="footerInput" accept="image/*">
          </div>
          <div class="col-md-4">
            <label for="excelInput" class="form-label">Excel File</label>
            <input class="form-control" type="file" id="excelInput" accept=".xls,.xlsx">
          </div>
          <div id="invoiceSelection" class="col-md-4 d-none">
            <label for="invoiceSelect" class="form-label">Select Invoices (optional)</label>
            <select id="invoiceSelect" class="form-select" multiple></select>
            <div class="form-text">Hold Ctrl (Windows) / Cmd (Mac) to select multiple. Leave unselected to generate all.</div>
          </div>
          <div class="col-12">
            <button type="button" id="generateBtn" class="btn btn-success">Generate Labels</button>
          </div>
        </form>
      </div>
    </div>
    <div id="alertPlaceholder" class="mt-3"></div>
  </div>

  <!-- Bootstrap Bundle JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const { jsPDF } = window.jspdf;
    let parsedRows = [], invoiceList = [];
    const alertPlaceholder = document.getElementById('alertPlaceholder');
    function showAlert(message, type='danger') {
      const wrapper = document.createElement('div');
      wrapper.innerHTML = `<div class="alert alert-${type} alert-dismissible" role="alert">
        ${message}
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
      </div>`;
      alertPlaceholder.append(wrapper);
    }

    document.getElementById('excelInput').addEventListener('change', async (e) => {
      const file = e.target.files[0]; if (!file) return;
      try {
        const buff = await readFileAsArrayBuffer(file);
        const wb = XLSX.read(buff, { type: 'array' });
        const sheet = wb.Sheets[wb.SheetNames[0]];
        let rows = XLSX.utils.sheet_to_json(sheet, { defval: '' });

        // Forward-fill essential columns
        const keys = ["Invoice","First Name","Last Name","Phone","Address","Order Total Amount"];
        const last = {};
        rows = rows.map(r => {
          keys.forEach(k => { r[k] !== '' ? last[k] = r[k] : r[k] = last[k] || ''; });
          return r;
        });
        parsedRows = rows;

        // Populate dropdown
        invoiceList = [...new Set(rows.map(r => String(r['Invoice']).trim()))].sort();
        const sel = document.getElementById('invoiceSelect'); sel.innerHTML = '';
        invoiceList.forEach(inv => {
          const opt = document.createElement('option'); opt.value = inv; opt.textContent = inv;
          sel.appendChild(opt);
        });
        document.getElementById('invoiceSelection').classList.remove('d-none');
      } catch (err) {
        showAlert('Error parsing Excel: ' + err.message);
      }
    });

    document.getElementById('generateBtn').addEventListener('click', async () => {
      alertPlaceholder.innerHTML = '';
      const headerFile = document.getElementById('headerInput').files[0];
      const footerFile = document.getElementById('footerInput').files[0];
      if (!headerFile || !footerFile) { showAlert('Select header & footer images.'); return; }
      if (!parsedRows.length) { showAlert('Upload & parse an Excel file first.'); return; }

      const selectedOpts = Array.from(document.getElementById('invoiceSelect').selectedOptions);
      const targets = selectedOpts.length ? selectedOpts.map(o => o.value) : invoiceList;

      const headerDataUrl = await readFileAsDataURL(headerFile);
      const footerDataUrl = await readFileAsDataURL(footerFile);
      const pdfs = [];

      for (const inv of targets) {
        const group = parsedRows.filter(r => String(r['Invoice']).trim() === inv);
        if (!group.length) continue;
        const doc = new jsPDF({ unit: 'mm', format: [152.4, 101.6] }); doc.setFontSize(10);
        doc.addImage(headerDataUrl, 'PNG', 0, 0, 101.6, 30);
        doc.addImage(footerDataUrl, 'PNG', 0, 106.4, 101.6, 49);
        let y = 41;
        doc.text(`Invoice #: ${inv}`, 5, y); y += 7;
        const name = titleCase(group[0]['First Name'] + ' ' + group[0]['Last Name']);
        doc.text(`Name: ${name}`, 5, y); y += 7;
        let phone = String(group[0]['Phone']).split('.')[0]; if (!phone.startsWith('0')) phone = '0' + phone;
        doc.text(`Phone: ${phone}`, 5, y); y += 7;
        doc.text('Address:', 5, y); y += 7;
        const addrLines = doc.splitTextToSize(titleCase(group[0]['Address']), 66);
        doc.text(addrLines, 5, y); y += addrLines.length * 7;
        const notes = group.map(r => r['NOTE'] || '').join(' ').toLowerCase();
        const total = notes.includes('paid') ? '0' : String(Math.round(group[0]['Order Total Amount']));
        doc.text(`Total: Tk ${total}`, 5, y); y += 7;
        doc.text('Items:', 5, y); y += 7;
        group.forEach(r => {
          const item = r['Items'] ? titleCase(r['Items']) : '';
          const qty = r['Quantity'] ? ` (${r['Quantity']})` : '';
          if (item) { doc.text(`- ${item}${qty}`, 5, y); y += 7; }
        });
        pdfs.push({ name: `${inv}.pdf`, blob: doc.output('blob') });
      }

      const zip = new JSZip(); pdfs.forEach(f => zip.file(f.name, f.blob));
      const blob = await zip.generateAsync({ type: 'blob' }); saveAs(blob, 'shipping_labels.zip');
    });

    function readFileAsDataURL(file) { return new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(file); }); }
    function readFileAsArrayBuffer(file) { return new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsArrayBuffer(file); }); }
    function titleCase(str) { return String(str).toLowerCase().split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' '); }
  </script>
</body>
</html>
