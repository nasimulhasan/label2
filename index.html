<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Shipping Label Generator</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <!-- SheetJS -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
  <!-- jsPDF UMD -->
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <style>
    body { padding-top: 4rem; background: #f8f9fa; }
    .hidden { display: none !important; }
    @media (min-width: 768px) {
      .col-md-6 { flex: 0 0 50%; max-width: 50%; }
    }
  </style>
</head>
<body>
  <div class="container d-flex justify-content-center">
    <div style="width:80%; max-width:800px;">

      <!-- Unlock Page -->
      <div id="unlockPage" class="card shadow-sm mb-4">
        <div class="card-body p-4 text-center">
          <h1 class="card-title mb-4">Enter Activation Code</h1>
          <input type="text" id="unlockInput" class="form-control mb-3" placeholder="Enter activation code">
          <button id="unlockBtn" class="btn btn-primary w-100 mb-3">Unlock</button>
          <div id="unlockAlert"></div>
        </div>
      </div>

      <!-- Excel Generator (hidden until unlocked) -->
      <div id="generatorPage" class="hidden">
        <div class="card shadow-sm mb-4">
          <div class="card-body p-4">

            <h2 class="h5 mb-4 text-center">Excel Label Generator</h2>

            <div class="mb-3">
              <label class="form-label">Upload Font (.ttf)</label>
              <input type="file" id="fontInput" class="form-control" accept=".ttf">
            </div>

            <div class="mb-3">
              <label class="form-label">Header Image</label>
              <input type="file" id="headerInput" class="form-control" accept="image/*">
            </div>

            <div class="mb-3">
              <label class="form-label">Footer Image</label>
              <input type="file" id="footerInput" class="form-control" accept="image/*">
            </div>

            <div class="mb-3 row">
              <label class="col-sm-4 col-form-label">Paper Size</label>
              <div class="col-sm-8">
                <select id="presetSize" class="form-select">
                  <option value="101.6,152.4,mm">4×6 in</option>
                  <option value="152.4,101.6,mm">6×4 in</option>
                  <option value="210,297,mm">A4</option>
                  <option value="216,279,mm">Letter</option>
                  <option value="custom">Custom</option>
                </select>
              </div>
            </div>

            <div id="customSizeFields" class="mb-3 row d-none">
              <div class="col-sm-4">
                <input type="number" id="paperWidth" class="form-control" placeholder="Width">
              </div>
              <div class="col-sm-4">
                <input type="number" id="paperHeight" class="form-control" placeholder="Height">
              </div>
              <div class="col-sm-4">
                <select id="paperUnit" class="form-select">
                  <option value="mm" selected>mm</option>
                  <option value="in">in</option>
                  <option value="pt">pt</option>
                </select>
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label">Excel File</label>
              <input type="file" id="excelInput" class="form-control" accept=".xls,.xlsx">
            </div>

            <div id="invoiceSelection" class="mb-3 hidden">
              <label class="form-label">Select Invoices</label>
              <select id="invoiceSelect" class="form-select" multiple size="8"></select>
            </div>

            <button type="button" id="generateBtn" class="btn btn-primary w-100">Generate Labels</button>
          </div>
        </div>
      </div>
      <!-- End Generator -->

    </div>
  </div>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const { jsPDF } = window.jspdf;

  // 1) UNLOCK HANDLER
  const unlockBtn   = document.getElementById('unlockBtn'),
        unlockInput = document.getElementById('unlockInput'),
        unlockAlert = document.getElementById('unlockAlert'),
        unlockPage  = document.getElementById('unlockPage'),
        genPage     = document.getElementById('generatorPage');
  unlockBtn.addEventListener('click', async () => {
    unlockAlert.innerHTML = '';
    try {
      const resp = await fetch('https://raw.githubusercontent.com/nasimulhasan/label2/main/keys.json');
      if (!resp.ok) throw new Error();
      const { validCodes } = await resp.json();
      if (validCodes.includes(unlockInput.value.trim())) {
        unlockAlert.innerHTML = '<div class="alert alert-success">Unlocked!</div>';
        unlockPage.classList.add('hidden');
        genPage.classList.remove('hidden');
      } else {
        unlockAlert.innerHTML = '<div class="alert alert-warning">Invalid code</div>';
      }
    } catch {
      unlockAlert.innerHTML = '<div class="alert alert-danger">Error verifying code</div>';
    }
  });

  // 2) CUSTOM‑SIZE TOGGLE
  document.getElementById('presetSize').addEventListener('change', e => {
    document.getElementById('customSizeFields')
      .classList.toggle('d-none', e.target.value !== 'custom');
  });

  // 3) INVOICE POPULATOR
  let invoiceRows = [];
  const excelIn     = document.getElementById('excelInput'),
        invoiceSel  = document.getElementById('invoiceSelect'),
        invoiceWrap = document.getElementById('invoiceSelection');
  excelIn.addEventListener('change', async e => {
    const file = e.target.files[0];
    if (!file) return;
    const data = await file.arrayBuffer();
    const wb   = XLSX.read(data, { type: 'array' });
    invoiceRows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: '' });
    invoiceSel.innerHTML = '';
    invoiceRows.forEach(r => {
      const inv = r['Invoice'] ?? r[Object.keys(r)[0]];
      if (inv) {
        const opt = document.createElement('option');
        opt.value = inv;
        opt.textContent = inv;
        invoiceSel.append(opt);
      }
    });
    invoiceWrap.classList.remove('hidden');
  });

  // helper to load images
  function loadImageFile(file) {
    return new Promise(res => {
      if (!file) return res(null);
      const reader = new FileReader();
      reader.onload = () => res(reader.result);
      reader.readAsDataURL(file);
    });
  }

  // helper to load and apply font
  function applyFont(doc) {
    return new Promise(res => {
      const file = document.getElementById('fontInput').files[0];
      if (!file) return res();
      const reader = new FileReader();
      reader.onload = () => {
        const b64 = reader.result.split(',')[1];
        doc.addFileToVFS(file.name, b64);
        doc.addFont(file.name, 'CustomFont', 'normal');
        doc.setFont('CustomFont');
        res();
      };
      reader.readAsDataURL(file);
    });
  }

  // 4) GENERATE PDF
  document.getElementById('generateBtn').addEventListener('click', async () => {
    const selected = Array.from(invoiceSel.selectedOptions).map(o => o.value);
    if (!selected.length) return alert('Select at least one invoice.');

    // load images and font
    const headerData = await loadImageFile(document.getElementById('headerInput').files[0]);
    const footerData = await loadImageFile(document.getElementById('footerInput').files[0]);

    // parse paper size
    const [w, h, unit] = document.getElementById('presetSize')
      .value.split(',').map((v,i) => i<2 ? Number(v) : v);

    const doc = new jsPDF({ unit, format: [w, h] });
    await applyFont(doc);

    selected.forEach((inv, idx) => {
      if (idx) doc.addPage();

      // HEADER: flush top, full width
      let currentY = 0;
      if (headerData) {
        const props = doc.getImageProperties(headerData);
        const imgW  = w;
        const imgH  = w * (props.height / props.width);
        doc.addImage(headerData, 'PNG', 0, 0, imgW, imgH);
        currentY = imgH + 5;
      } else {
        currentY = 10;
      }

      // body text
      const row = invoiceRows.find(r => (r['Invoice'] ?? r[Object.keys(r)[0]]) == inv) || {};
      doc.setFontSize(12);
      doc.text(`Invoice: ${inv}`, 10, currentY);
      doc.text(`Name: ${row['Name']||''}`, 10, currentY + 8);
      doc.text(`Phone: ${row['Phone']||''}`, 10, currentY + 16);
      doc.text(`Address: ${row['Address']||''}`, 10, currentY + 24, { maxWidth: w - 20 });
      doc.text(`Total: ${row['Total']||''}`, 10, currentY + 40);

      // items list
      const items = (row['Items']||'').split('\n');
      let y = currentY + 48;
      doc.text('Items:', 10, y);
      items.forEach(item => {
        y += 6;
        doc.text(`- ${item}`, 12, y);
      });

      // FOOTER: flush bottom, full width
      if (footerData) {
        const propsF = doc.getImageProperties(footerData);
        const fW     = w;
        const fH     = w * (propsF.height / propsF.width);
        doc.addImage(footerData, 'PNG', 0, h - fH, fW, fH);
      }
    });

    doc.save('labels.pdf');
  });
});
</script>



</body>
</html>
