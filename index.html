<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shipping Label Generator</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- SheetJS for Excel parsing -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
  <!-- jsPDF for PDF generation -->
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <!-- JSZip for zipping files -->
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.0/dist/jszip.min.js"></script>
  <!-- FileSaver for saving blobs -->
  <script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
  <style>
    body { padding-top: 2rem; background: #f8f9fa; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="container d-flex justify-content-center">
    <div class="w-100" style="max-width: 600px;">

      <!-- Main Card -->
      <div class="card shadow-sm mb-4">
        <div class="card-body p-4">
          <h1 class="card-title text-center mb-4">Custom Label Generator</h1>

          <!-- Instructions Accordion -->
          <div class="accordion mb-4" id="instructionsAccordion">
            <!-- ... your instructions here ... -->
          </div>

          <!-- Form -->
          <form id="labelForm">
            <div class="mb-2">
              <label for="headerInput" class="form-label">Header Image</label>
              <input type="file" class="form-control" id="headerInput" accept="image/*">
            </div>
            <div class="mb-2">
              <label for="footerInput" class="form-label">Footer Image</label>
              <input type="file" class="form-control" id="footerInput" accept="image/*">
            </div>
            <div class="mb-2">
              <label for="excelInput" class="form-label">Excel File</label>
              <input type="file" class="form-control" id="excelInput" accept=".xls,.xlsx">
            </div>
            <div id="invoiceSelection" class="mb-2 hidden">
              <label for="invoiceSelect" class="form-label">Select Invoices (optional)</label>
              <select id="invoiceSelect" class="form-select" multiple size="8"></select>
              <div class="form-text">Hold Ctrl (Windows) / Cmd (Mac) to select multiple.</div>
            </div>
            <button type="button" id="generateBtn" class="btn btn-primary w-100">Generate Labels</button>
          </form>
          <div id="alertPlaceholder" class="mt-3"></div>
        </div>
      </div>

      <!-- Buy Me a Coffee Accordion -->
      <div class="accordion mb-4" id="coffeeAccordion">
        <!-- ... coffee accordion ... -->
      </div>

    </div>
  </div>

  <!-- Bootstrap Bundle JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const { jsPDF } = window.jspdf;
    let parsedRows = [], invoiceList = [];
    const alertPlaceholder = document.getElementById('alertPlaceholder');

    function showAlert(msg, type='danger') {
      const wr = document.createElement('div');
      wr.innerHTML = `
        <div class="alert alert-${type} alert-dismissible" role="alert">
          ${msg}
          <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>`;
      alertPlaceholder.append(wr);
    }

    document.getElementById('excelInput').addEventListener('change', async e => {
      const file = e.target.files[0];
      if (!file) return;
      try {
        const buff = await readFileAsArrayBuffer(file);
        const wb = XLSX.read(buff, { type:'array' });
        const sheet = wb.Sheets[wb.SheetNames[0]];
        let rows = XLSX.utils.sheet_to_json(sheet, { defval: '' });
        const keys = ["Invoice","First Name","Last Name","Phone","Address","Order Total Amount"];
        const last = {};
        rows = rows.map(r => {
          keys.forEach(k => {
            if (r[k] !== '') last[k] = r[k];
            else r[k] = last[k]||'';
          });
          return r;
        });
        parsedRows = rows;
        invoiceList = [...new Set(rows.map(r=>String(r.Invoice).trim()))].sort();
        const sel = document.getElementById('invoiceSelect');
        sel.innerHTML = '';
        invoiceList.forEach(inv => {
          const o = document.createElement('option');
          o.value = inv; o.textContent = inv;
          sel.appendChild(o);
        });
        document.getElementById('invoiceSelection').classList.remove('hidden');
      } catch(err) {
        showAlert('Error parsing Excel: '+err.message);
      }
    });

    document.getElementById('generateBtn').addEventListener('click', async () => {
      alertPlaceholder.innerHTML = '';
      const hf = document.getElementById('headerInput').files[0];
      const ff = document.getElementById('footerInput').files[0];
      if (!hf||!ff) { showAlert('Select both header & footer images.'); return; }
      if (!parsedRows.length) { showAlert('Upload & parse Excel first.'); return; }

      const sel = Array.from(document.getElementById('invoiceSelect').selectedOptions);
      const targets = sel.length ? sel.map(o=>o.value) : invoiceList;
      const hd = await readFileAsDataURL(hf);
      const fd = await readFileAsDataURL(ff);
      const pdfs = [];

      for (const inv of targets) {
        const group = parsedRows.filter(r=>String(r.Invoice).trim()===inv);
        if (!group.length) continue;
        const doc = new jsPDF({ unit:'mm', format:[152.4,101.6] });
        doc.setFontSize(10);
        doc.addImage(hd,'PNG',0,0,101.6,30);
        doc.addImage(fd,'PNG',0,106.4,101.6,49);

        const leftMargin = 10;
        let y = 41;
        doc.text(`Invoice #: ${inv}`, leftMargin, y); y+=7;
        const name = titleCase(group[0]['First Name']+' '+group[0]['Last Name']);
        doc.text(`Name: ${name}`, leftMargin, y); y+=7;

        // Phone normalize
        let d = String(group[0].Phone).replace(/\D/g,'');
        if (d.startsWith('880')) d = d.slice(3);
        else if (d.startsWith('0')) d = d.slice(1);
        if (d.length>10) d = d.slice(-10);
        const phone = '0'+d;
        doc.text(`Phone: ${phone}`, leftMargin, y); y+=7;

        // Address on same lines
        const fullAddr = `Address: ${titleCase(group[0].Address)}`;
        const addrLines = doc.splitTextToSize(fullAddr, 66);
        addrLines.forEach((line, i) => {
          doc.text(line, leftMargin, y + i * 7);
        });
        y += addrLines.length * 7;

        const notes = group.map(r=>r.NOTE||'').join(' ').toLowerCase();
        const total = notes.includes('paid') ? '0' : String(Math.round(group[0]['Order Total Amount']));
        doc.text(`Total: Tk ${total}`, leftMargin, y); y+=7;

        doc.text('Items:', leftMargin, y); y+=7;
        group.forEach(r => {
          const item = r.Items ? titleCase(r.Items) : '';
          const qty = r.Quantity ? ` (${r.Quantity})` : '';
          if (item) {
            doc.text(`- ${item}${qty}`, leftMargin, y);
            y+=7;
          }
        });

        pdfs.push({ name:`${inv}.pdf`, blob:doc.output('blob') });
      }

      const zip = new JSZip();
      pdfs.forEach(f=>zip.file(f.name, f.blob));
      const blob = await zip.generateAsync({ type:'blob' });
      saveAs(blob, 'shipping_labels.zip');
    });

    function readFileAsDataURL(f) {
      return new Promise(r=> {
        const rd = new FileReader();
        rd.onload = ()=>r(rd.result);
        rd.readAsDataURL(f);
      });
    }
    function readFileAsArrayBuffer(f) {
      return new Promise(r=> {
        const rd = new FileReader();
        rd.onload = ()=>r(rd.result);
        rd.readAsArrayBuffer(f);
      });
    }
    function titleCase(s) {
      return String(s).toLowerCase().split(' ')
        .map(w=>w.charAt(0).toUpperCase()+w.slice(1))
        .join(' ');
    }
  </script>
</body>
</html>
