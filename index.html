<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Shipping Label Generator</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <!-- SheetJS -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
  <!-- jsPDF -->
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <!-- JSZip -->
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.0/dist/jszip.min.js"></script>
  <!-- FileSaver -->
  <script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
  <style>
    body { padding-top: 4rem; background: #f8f9fa; }
    .hidden { display: none !important; }
    @media (min-width: 768px) {
      .col-md-6 { flex:0 0 50%; max-width:50%; }
    }
  </style>
</head>
<body>
  <div class="container d-flex justify-content-center">
    <div style="width:80%; max-width:800px;">

      <!-- Unlock Page -->
      <div id="unlockPage" class="card shadow-sm mb-4">
        <div class="card-body p-4 text-center">
          <h1 class="card-title mb-4">Enter Unlock Code</h1>
          <input type="text" id="unlockInput" class="form-control mb-3" placeholder="Enter unlock code">
          <button id="unlockBtn" class="btn btn-primary w-100 mb-3">Unlock</button>
          <div id="unlockAlert"></div>
          <div class="accordion mt-4" id="unlockInfoAccordion">
            <div class="accordion-item">
              <h2 class="accordion-header" id="headingUnlockInfo">
                <button class="accordion-button collapsed" type="button"
                        data-bs-toggle="collapse" data-bs-target="#collapseUnlockInfo"
                        aria-expanded="false" aria-controls="collapseUnlockInfo">
                  How to get Unlock Code?
                </button>
              </h2>
              <div id="collapseUnlockInfo" class="accordion-collapse collapse"
                   aria-labelledby="headingUnlockInfo" data-bs-parent="#unlockInfoAccordion">
                <div class="accordion-body text-start">
                  <p>
                    To obtain an unlock code, visit our pricing page and complete the purchase form.
                    Once payment is confirmed, your code will arrive via email within minutes.
                  </p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Generators (hidden until unlocked) -->
      <div id="generatorPage" class="hidden">
        <div class="row gx-4">

          <!-- Excel Generator -->
          <div class="col-md-6">
            <div class="card shadow-sm mb-4">
              <div class="card-body p-4">
                <h2 class="h5 mb-3">Excel Label Generator</h2>
                <div class="mb-3 row">
                  <label class="col-sm-4 col-form-label">Paper Size</label>
                  <div class="col-sm-8">
                    <select id="presetSize" class="form-select">
                      <option value="101.6,152.4,mm">4×6 in</option>
                      <option value="152.4,101.6,mm">6×4 in</option>
                      <option value="210,297,mm">A4</option>
                      <option value="216,279,mm">Letter</option>
                      <option value="custom">Custom</option>
                    </select>
                  </div>
                </div>
                <div id="customSizeFields" class="mb-3 row d-none">
                  <div class="col-sm-4"><input type="number" id="paperWidth" class="form-control" placeholder="Width"></div>
                  <div class="col-sm-4"><input type="number" id="paperHeight" class="form-control" placeholder="Height"></div>
                  <div class="col-sm-4">
                    <select id="paperUnit" class="form-select">
                      <option value="mm" selected>mm</option>
                      <option value="in">in</option>
                      <option value="pt">pt</option>
                    </select>
                  </div>
                </div>
                <form id="labelForm">
                  <div class="mb-2">
                    <label class="form-label">Upload Font (optional)</label>
                    <input type="file" id="fontInput" class="form-control" accept=".ttf,.otf">
                  </div>
                  <div class="mb-2">
                    <label class="form-label">Header Image</label>
                    <input type="file" id="headerInput" class="form-control" accept="image/*">
                  </div>
                  <div class="mb-2">
                    <label class="form-label">Footer Image</label>
                    <input type="file" id="footerInput" class="form-control" accept="image/*">
                  </div>
                  <div class="mb-2">
                    <label class="form-label">Excel File</label>
                    <input type="file" id="excelInput" class="form-control" accept=".xls,.xlsx">
                  </div>
                  <div id="invoiceSelection" class="mb-2 hidden">
                    <label class="form-label">Select Invoices</label>
                    <select id="invoiceSelect" class="form-select" multiple size="8"></select>
                  </div>
                  <button type="button" id="generateBtn" class="btn btn-primary w-100">Generate Labels</button>
                </form>
                <div id="alertPlaceholder" class="mt-3"></div>
              </div>
            </div>
          </div>

          <!-- Manual Generator -->
          <div class="col-md-6">
            <div class="card shadow-sm mb-4">
              <div class="card-body p-4">
                <h2 class="h5 mb-3">Manual Label Generator</h2>
                <div class="mb-2">
                  <label class="form-label">Upload Font (optional)</label>
                  <input type="file" id="manFontInput" class="form-control" accept=".ttf,.otf">
                </div>
                <div class="mb-2">
                  <label class="form-label">Header Image</label>
                  <input type="file" id="manHeaderInput" class="form-control" accept="image/*">
                </div>
                <div class="mb-2">
                  <label class="form-label">Footer Image</label>
                  <input type="file" id="manFooterInput" class="form-control" accept="image/*">
                </div>
                <div class="mb-3 row">
                  <label class="col-sm-4 col-form-label">Paper Size</label>
                  <div class="col-sm-8">
                    <select id="manPresetSize" class="form-select">
                      <option value="101.6,152.4,mm">4×6 in</option>
                      <option value="152.4,101.6,mm">6×4 in</option>
                      <option value="210,297,mm">A4</option>
                      <option value="216,279,mm">Letter</option>
                      <option value="custom">Custom</option>
                    </select>
                  </div>
                </div>
                <div id="manCustomSizeFields" class="mb-3 row d-none">
                  <div class="col-sm-4"><input type="number" id="manPaperWidth" class="form-control" placeholder="Width"></div>
                  <div class="col-sm-4"><input type="number" id="manPaperHeight" class="form-control" placeholder="Height"></div>
                  <div class="col-sm-4">
                    <select id="manPaperUnit" class="form-select">
                      <option value="mm" selected>mm</option>
                      <option value="in">in</option>
                      <option value="pt">pt</option>
                    </select>
                  </div>
                </div>
                <form id="manualForm">
                  <div class="mb-2"><input type="text" id="manInvoice" class="form-control" placeholder="Invoice #"></div>
                  <div class="mb-2"><input type="text" id="manFirstName" class="form-control" placeholder="First Name"></div>
                  <div class="mb-2"><input type="text" id="manLastName" class="form-control" placeholder="Last Name"></div>
                  <div class="mb-2"><input type="tel"  id="manPhone" class="form-control" placeholder="Phone"></div>
                  <div class="mb-2"><textarea id="manAddress" class="form-control" rows="2" placeholder="Address"></textarea></div>
                  <div class="mb-2"><input type="number" id="manTotal" class="form-control" placeholder="Total Amount"></div>
                  <div class="mb-2"><textarea id="manItems" class="form-control" rows="3" placeholder="Items (one per line)"></textarea></div>
                  <button type="button" id="generateManualBtn" class="btn btn-secondary w-100">Generate Manual Label</button>
                </form>
              </div>
            </div>
          </div>

        </div>
      </div>

    </div>
  </div>

  <!-- Unlock handler first -->
  <script>
    async function checkUnlock(code) {
      const resp = await fetch('https://raw.githubusercontent.com/nasimulhasan/testlabel/main/keys.json');
      if (!resp.ok) throw new Error();
      const { validCodes } = await resp.json();
      return validCodes.includes(code);
    }
    document.getElementById('unlockBtn').onclick = async () => {
      const code = document.getElementById('unlockInput').value.trim();
      const alert = document.getElementById('unlockAlert');
      alert.innerHTML = '';
      try {
        if (await checkUnlock(code)) {
          alert.innerHTML = '<div class="alert alert-success">Unlocked!</div>';
          document.getElementById('unlockPage').classList.add('hidden');
          document.getElementById('generatorPage').classList.remove('hidden');
        } else {
          alert.innerHTML = '<div class="alert alert-warning">Invalid code</div>';
        }
      } catch {
        alert.innerHTML = '<div class="alert alert-danger">Error verifying code</div>';
      }
    };
  </script>

  <!-- Main generator logic -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const { jsPDF } = window.jspdf;
      let parsedRows = [], invoiceList = [], customFontName = '', customFontData = '';

      const readURL = file => new Promise(r => {
        const fr = new FileReader();
        fr.onload = () => r(fr.result);
        fr.readAsDataURL(file);
      });
      const readBuffer = file => new Promise(r => {
        const fr = new FileReader();
        fr.onload = () => r(fr.result);
        fr.readAsArrayBuffer(file);
      });
      const titleCase = s =>
        s.toLowerCase().split(' ')
         .map(w => w.charAt(0).toUpperCase() + w.slice(1))
         .join(' ');

      // Paper‐size toggles
      document.getElementById('presetSize').addEventListener('change', e =>
        document.getElementById('customSizeFields').classList.toggle('d-none', e.target.value !== 'custom')
      );
      document.getElementById('manPresetSize').addEventListener('change', e =>
        document.getElementById('manCustomSizeFields').classList.toggle('d-none', e.target.value !== 'custom')
      );

      // Excel parsing
      document.getElementById('excelInput').addEventListener('change', async e => {
        try {
          const f = e.target.files[0];
          if (!f) return;
          const buff = await readBuffer(f);
          const wb   = XLSX.read(buff, { type:'array' });
          let last   = {};
          parsedRows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval:'' })
            .map(r => {
              ['Invoice','First Name','Last Name','Phone','Address','Order Total Amount']
                .forEach(k => r[k] = r[k] || last[k] || '');
              last = { ...r };
              return r;
            });
          invoiceList = [...new Set(parsedRows.map(r => r.Invoice.trim()))].sort();
          const sel = document.getElementById('invoiceSelect');
          sel.innerHTML = '';
          invoiceList.forEach(inv => sel.append(new Option(inv, inv)));
          document.getElementById('invoiceSelection').classList.remove('hidden');
        } catch (err) {
          console.error(err);
          alert('Error parsing Excel');
        }
      });

      // Excel generate
      document.getElementById('fontInput').addEventListener('change', async e => {
        const f = e.target.files[0]; if (!f) return;
        const url = await readURL(f);
        customFontName = f.name;
        customFontData = url.split(',')[1];
      });
      document.getElementById('generateBtn').onclick = async () => {
        try {
          const hf = document.getElementById('headerInput').files[0];
          const ff = document.getElementById('footerInput').files[0];
          if (!hf || !ff) return alert('Select header and footer');
          if (!parsedRows.length) return alert('Upload and parse Excel first');

          const header = await readURL(hf);
          const footer = await readURL(ff);
          let [w,h,unit] = document.getElementById('presetSize').value.split(',');
          if (w === 'custom') {
            w = +document.getElementById('paperWidth').value;
            h = +document.getElementById('paperHeight').value;
            unit = document.getElementById('paperUnit').value;
            if (unit==='in'){w*=25.4;h*=25.4;unit='mm';}
            if (unit==='pt'){w*=0.352778;h*=0.352778;unit='mm';}
          } else { w=+w; h=+h; }
          const zip = new JSZip();
          const opts = Array.from(document.getElementById('invoiceSelect').selectedOptions).map(o=>o.value);
          const targets = opts.length ? opts : invoiceList;

          for (const inv of targets) {
            const group = parsedRows.filter(r=>r.Invoice.trim()===inv);
            const doc   = new jsPDF({ unit, format:[w,h] });
            if (customFontName && customFontData) {
              doc.addFileToVFS(customFontName, customFontData);
              doc.addFont(customFontName, 'Custom', 'normal');
              doc.setFont('Custom','normal');
            }
            doc.setFontSize(10);

            const hp = doc.getImageProperties(header);
            const hh = w*(hp.height/hp.width);
            doc.addImage(header,'PNG',0,0,w,hh);

            const fp = doc.getImageProperties(footer);
            const fh = w*(fp.height/fp.width);
            doc.addImage(footer,'PNG',0,h-fh,w,fh);

            let y=hh+11, left=10;
            doc.text(`Invoice #: ${inv}`, left, y); y+=7;

            const rec  = group[0];
            const name = titleCase(`${rec['First Name']} ${rec['Last Name']}`);
            doc.text(`Name: ${name}`, left, y); y+=7;

            let num = rec.Phone.replace(/\D/g,'');
            if (num.startsWith('880')) num=num.slice(3);
            else if (num.startsWith('0')) num=num.slice(1);
            if (num.length>10) num=num.slice(-10);
            doc.text(`Phone: 0${num}`, left, y); y+=7;

            const addrLines = doc.splitTextToSize(`Address: ${titleCase(rec.Address)}`, w-left*2);
            doc.text(addrLines, left, y); y+=addrLines.length*7;

            const paidNotes = group.map(r=>r.NOTE||'').join(' ').toLowerCase();
            const total = paidNotes.includes('paid') ? '0' : `${Math.round(rec['Order Total Amount'])}`;
            doc.text(`Total: Tk ${total}`, left, y); y+=7;

            doc.text('Items:', left, y); y+=7;
            group.forEach(r=>{
              if (r.Items) {
                doc.text(`- ${titleCase(r.Items)}`, left+10, y);
                y+=7;
              }
            });

            zip.file(`${inv}.pdf`, doc.output('blob'));
          }

          const blob = await zip.generateAsync({type:'blob'});
          saveAs(blob,'shipping_labels.zip');
        } catch (err) {
          console.error(err);
          alert('Error generating labels');
        }
      };

      // Manual generate
      document.getElementById('manFontInput').addEventListener('change', async e => {
        const f = e.target.files[0]; if (!f) return;
        const url = await readURL(f);
        customFontName = f.name;
        customFontData = url.split(',')[1];
      });
      document.getElementById('generateManualBtn').onclick = async () => {
        try {
          const inv = document.getElementById('manInvoice').value.trim();
          if (!inv) return alert('Enter invoice');
          const rec = {
            'Invoice': inv,
            'First Name': document.getElementById('manFirstName').value.trim(),
            'Last Name': document.getElementById('manLastName').value.trim(),
            'Phone': document.getElementById('manPhone').value.trim(),
            'Address': document.getElementById('manAddress').value.trim(),
            'Order Total Amount': parseFloat(document.getElementById('manTotal').value)||0
          };
          const items = document.getElementById('manItems').value.trim().split('\n').filter(x=>x);

          const hf = document.getElementById('manHeaderInput').files[0];
          const ff = document.getElementById('manFooterInput').files[0];
          if (!hf||!ff) return alert('Upload header & footer');
          const header = await readURL(hf);
          const footer = await readURL(ff);

          let [w,h,unit] = document.getElementById('manPresetSize').value.split(',');
          if (w==='custom') {
            w = +document.getElementById('manPaperWidth').value;
            h = +document.getElementById('manPaperHeight').value;
            unit = document.getElementById('manPaperUnit').value;
            if (unit==='in'){w*=25.4;h*=25.4;unit='mm';}
            if (unit==='pt'){w*=0.352778;h*=0.352778;unit='mm';}
          } else { w=+w; h=+h; }

          const doc = new jsPDF({ unit, format:[w,h] });
          doc.setFontSize(10);
          if (customFontName && customFontData) {
            doc.addFileToVFS(customFontName, customFontData);
            doc.addFont(customFontName, 'Custom', 'normal');
            doc.setFont('Custom','normal');
          }

          const hp = doc.getImageProperties(header);
          const hh = w*(hp.height/hp.width);
          doc.addImage(header,'PNG',0,0,w,hh);

          const fp = doc.getImageProperties(footer);
          const fh = w*(fp.height/fp.width);
          doc.addImage(footer,'PNG',0,h-fh,w,fh);

          let y=hh+11, left=10;
          doc.text(`Invoice #: ${inv}`, left, y); y+=7;
          const nm = titleCase(`${rec['First Name']} ${rec['Last Name']}`);
          doc.text(`Name: ${nm}`, left, y); y+=7;

          let num = rec.Phone.replace(/\D/g,'');
          if (num.startsWith('880')) num=num.slice(3);
          else if (num.startsWith('0')) num=num.slice(1);
          if (num.length>10) num=num.slice(-10);
          doc.text(`Phone: 0${num}`, left, y); y+=7;

          const addrLines = doc.splitTextToSize(`Address: ${titleCase(rec.Address)}`, w-left*2);
          doc.text(addrLines, left, y); y+=addrLines.length*7;

          doc.text(`Total: Tk ${Math.round(rec['Order Total Amount'])}`, left, y); y+=7;
          doc.text('Items:', left, y); y+=7;
          items.forEach(it => {
            doc.text(`- ${titleCase(it)}`, left+10, y);
            y+=7;
          });

          doc.save(`label_${inv}.pdf`);
        } catch (err) {
          console.error(err);
          alert('Error generating manual label');
        }
      };
    });
  </script>
</body>
</html>
